# Erebuz private-route backend — the whole thing in one stack.
#
#   cd infra/stack && cp .env.example .env   # then fill it in
#   docker compose --env-file .env up -d --build
#
# Brings up, wired together:
#   mongo      — datastore for the POI node (internal only, never published)
#   poi-node   — Railgun Private Proof-of-Innocence aggregator (Arbitrum + more)
#   tee        — the private-route API the app calls
#
# One image per process on purpose: the TEE is Node 20, the POI node is Node 18,
# and Mongo needs its own volume — three lifecycles, one `docker compose up`.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-poi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - poi-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  poi-node:
    build:
      context: ../poi-node
      args:
        POI_REF: ${POI_REF:-4b1eaf6ef19099dbfd6b43b1ca78d2ce0132a752}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      LIST_PROVIDER: "1"
      pkey: ${pkey:?Set pkey in .env (POI list-provider private key)}
      pubkey: ${pubkey:?Set pubkey in .env}
      NODE_CONFIGS: ${NODE_CONFIGS:-[]}
      # Restrict synced networks (unset = all). Public RPCs 403 on mainnet sync
      # and crash-loop the node, so pin to what you use (Arbitrum for prod).
      ACTIVE_NETWORKS: ${ACTIVE_NETWORKS:-Arbitrum}
      DOCUMENT_DB_URL: mongodb://${MONGO_USER:-poi}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/?authSource=admin
      PORT: "8080"
    # Internal by default: the TEE reaches it over the compose network as
    # http://poi-node:8080. Only published if you set POI_BIND (see README).
    ports:
      - "${POI_BIND:-127.0.0.1}:${POI_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:8080/node-status-v2',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  tee:
    build:
      context: ../../packages/tee
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      poi-node:
        condition: service_healthy
    environment:
      PORT: "3000"
      # Reach the POI node over the internal compose network.
      RAILGUN_POI_NODE_URL: http://poi-node:8080
      PRIVATE_KEY: ${PRIVATE_KEY:?Set PRIVATE_KEY in .env (funded Arbitrum signer)}
      ROUTE_ENCRYPTION_KEY: ${ROUTE_ENCRYPTION_KEY:?Set ROUTE_ENCRYPTION_KEY in .env}
      RAILGUN_MNEMONIC: ${RAILGUN_MNEMONIC:?Set RAILGUN_MNEMONIC in .env}
      RAILGUN_ENCRYPTION_KEY: ${RAILGUN_ENCRYPTION_KEY:?Set RAILGUN_ENCRYPTION_KEY in .env}
      RELAY_API_URL: ${RELAY_API_URL:-https://api.relay.link}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      # Verified-token filter (true for mainnet; set false for testnet, whose
      # tokens are unverified). Fee floor in USD (lower it for small testnet demos).
      RELAY_VERIFIED_ONLY: ${RELAY_VERIFIED_ONLY:-true}
      PRIVATE_ROUTE_FEE_MIN_USD: ${PRIVATE_ROUTE_FEE_MIN_USD:-1}
      ETH_MAINNET_RPC_URL: ${ETH_MAINNET_RPC_URL:-}
      PRIVACY_HUB_CHAIN_ID: ${PRIVACY_HUB_CHAIN_ID:-42161}
      PRIVACY_HUB_TOKEN_SYMBOL: ${PRIVACY_HUB_TOKEN_SYMBOL:-USDC}
      DEFAULT_PRIVACY_PROVIDER: ${DEFAULT_PRIVACY_PROVIDER:-railgun}
      BRIDGE_PROVIDER: ${BRIDGE_PROVIDER:-relay}
      ARC_PRIVACY_ASP_URL: ${ARC_PRIVACY_ASP_URL:-http://asp:8787}
      ARC_PRIVACY_ARTIFACTS_URL: ${ARC_PRIVACY_ARTIFACTS_URL:-}
      # RPC for the Railgun hub chain (required for the privacy leg). Set the one
      # matching PRIVACY_HUB_CHAIN_ID: 42161 for prod (Arbitrum), 11155111 for the
      # Sepolia test hub. Use your own (Alchemy/Infura) for reliability.
      RAILGUN_RPC_42161: ${RAILGUN_RPC_42161:-}
      RAILGUN_RPC_11155111: ${RAILGUN_RPC_11155111:-}
      # Persist sqlite + railgun db + artifacts on the named volume.
      DATABASE_PATH: /app/data/tee.sqlite
      RAILGUN_DB_PATH: /app/data/railgun.db
      RAILGUN_ARTIFACT_PATH: /app/data/artifacts
    volumes:
      - tee-data:/app/data
    # The public API the app calls. Bound to localhost by default — put a TLS
    # reverse proxy in front and set NEXT_PUBLIC_TEE_URL to its https URL.
    ports:
      - "${TEE_BIND:-127.0.0.1}:${TEE_HOST_PORT:-3000}:3000"

  asp:
    image: erebuz-arc-asp:testnet
    build:
      context: ${ARC_ASP_BUILD_CONTEXT:-../../../privacy-pool-arc}
      dockerfile: packages/asp/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      ARC_TESTNET_RPC: ${ARC_TESTNET_RPC:-https://rpc.drpc.testnet.arc.network}
      ASP_HOST: 0.0.0.0
      ASP_PORT: "8787"
      ASP_SYNC_CONFIRMATIONS: ${ASP_SYNC_CONFIRMATIONS:-2}
      ASP_RELOAD_INTERVAL_MS: ${ASP_RELOAD_INTERVAL_MS:-5000}
      ASP_IPFS_API_URL: ${ASP_IPFS_API_URL:-https://rpc.filebase.io}
      ASP_IPFS_BEARER_TOKEN: ${ASP_IPFS_BEARER_TOKEN:?Set ASP_IPFS_BEARER_TOKEN in .env}
      ASP_IPFS_GATEWAY_URL: ${ASP_IPFS_GATEWAY_URL:-https://ipfs.filebase.io}
    ports:
      - "${ASP_BIND:-127.0.0.1}:${ASP_HOST_PORT:-8787}:8787"
    volumes:
      - asp-data:/srv/privacy-pools/packages/asp/data/arc-testnet
      - asp-policy:/srv/privacy-pools/packages/asp/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  asp-operator:
    image: erebuz-arc-asp:testnet
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      asp:
        condition: service_healthy
      tee:
        condition: service_started
    command: ["node", "src/operator.mjs"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      ARC_TESTNET_RPC: ${ARC_TESTNET_RPC:-https://rpc.drpc.testnet.arc.network}
      WALL8_DATABASE_PATH: /wall8/tee.sqlite
      ASP_POSTMAN_PRIVATE_KEY: ${ASP_POSTMAN_PRIVATE_KEY:?Set ASP_POSTMAN_PRIVATE_KEY in .env}
      ASP_OPERATOR_TESTNET_ONLY: "true"
      ASP_OPERATOR_INTERVAL_MS: ${ASP_OPERATOR_INTERVAL_MS:-15000}
      ASP_IPFS_API_URL: ${ASP_IPFS_API_URL:-https://rpc.filebase.io}
      ASP_IPFS_BEARER_TOKEN: ${ASP_IPFS_BEARER_TOKEN:?Set ASP_IPFS_BEARER_TOKEN in .env}
      ASP_IPFS_GATEWAY_URL: ${ASP_IPFS_GATEWAY_URL:-https://ipfs.filebase.io}
    volumes:
      - asp-data:/srv/privacy-pools/packages/asp/data/arc-testnet
      - asp-policy:/srv/privacy-pools/packages/asp/config
      - tee-data:/wall8:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  poi-mongo-data:
  tee-data:
  asp-data:
  asp-policy:
